<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Knowledge Base</title>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyBuSlOxJOUa7MtnQcR8Q_tKo1bALT8KAdI",
  authDomain: "kb-israel-2026.firebaseapp.com",
  projectId: "kb-israel-2026",
  storageBucket: "kb-israel-2026.firebasestorage.app",
  messagingSenderId: "200873987937",
  appId: "1:200873987937:web:a590589f0927cb82647f20"
});

const db = getFirestore(app);
let tickets = [];

async function load() {
  const q = query(collection(db, 'tickets'), orderBy('createdAt', 'desc'));
  const snap = await getDocs(q);
  tickets = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  render(tickets);
}

function render(list) {
  const el = document.getElementById('cards');
  const count = document.getElementById('count');
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = q ? list.filter(t =>
    (t.title||'').toLowerCase().includes(q) ||
    (t.description||'').toLowerCase().includes(q) ||
    (t.solution||'').toLowerCase().includes(q) ||
    (t.tags||'').toLowerCase().includes(q)
  ) : list;
  count.textContent = filtered.length + ' תקלות';
  if (!filtered.length) { el.innerHTML = '<div class="empty">לא נמצאו תקלות</div>'; return; }
  el.innerHTML = filtered.map(t => `
    <div class="card" onclick="openDetail('${t.id}')">
      <h3>${t.title}</h3>
      ${t.description ? `<div class="desc">${t.description}</div>` : ''}
      <div class="tags">${(t.tags||'').split(',').filter(Boolean).map(tag => `<span class="tag">${tag.trim()}</span>`).join('')}</div>
      <div class="date">${t.createdAt ? new Date(t.createdAt.seconds*1000).toLocaleDateString('he-IL') : ''}</div>
    </div>
  `).join('');
}

window.openAdd = () => document.getElementById('addModal').classList.add('open');
window.closeAdd = () => document.getElementById('addModal').classList.remove('open');
window.closeDetail = () => document.getElementById('detailModal').classList.remove('open');

window.saveTicket = async () => {
  const title = document.getElementById('f-title').value.trim();
  const solution = document.getElementById('f-solution').value.trim();
  if (!title || !solution) { alert('כותרת ופתרון הם שדות חובה'); return; }
  await addDoc(collection(db, 'tickets'), {
    title,
    description: document.getElementById('f-desc').value,
    solution,
    tags: document.getElementById('f-tags').value,
    createdAt: new Date()
  });
  closeAdd();
  ['f-title','f-desc','f-solution','f-tags'].forEach(id => document.getElementById(id).value = '');
  load();
};

window.openDetail = (id) => {
  const t = tickets.find(x => x.id === id);
  if (!t) return;
  document.getElementById('detailContent').innerHTML = `
    <div class="detail-title">${t.title}</div>
    ${t.description ? `<div class="detail-section"><h4>תיאור הבעיה</h4><p>${t.description}</p></div>` : ''}
    <div class="detail-section"><h4>פתרון</h4><p>${t.solution}</p></div>
    ${t.tags ? `<div class="tags" style="margin-bottom:1rem">${t.tags.split(',').filter(Boolean).map(tag => `<span class="tag">${tag.trim()}</span>`).join('')}</div>` : ''}
    <div class="date">${t.createdAt ? new Date(t.createdAt.seconds*1000).toLocaleDateString('he-IL') : ''}</div>
    <div class="modal-actions" style="margin-top:1.5rem">
      <button class="btn btn-danger" onclick="deleteTicket('${t.id}')">מחק</button>
      <button class="btn btn-ghost" onclick="closeDetail()">סגור</button>
    </div>
  `;
  document.getElementById('detailModal').classList.add('open');
};

window.deleteTicket = async (id) => {
  if (!confirm('למחוק?')) return;
  await deleteDoc(doc(db, 'tickets', id));
  closeDetail();
  load();
};

document.getElementById('search').addEventListener('input', () => render(tickets));
document.getElementById('addModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeAdd(); });
document.getElementById('detailModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeDetail(); });

load();
</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
.bg { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 0%, rgba(99,102,241,0.15) 0%, transparent 70%); pointer-events: none; }
header { padding: 2rem 1.5rem 1rem; text-align: center; }
header h1 { font-size: 2rem; font-weight: 800; color: #fff; }
header p { color: #94a3b8; margin-top: 0.3rem; font-size: 0.95rem; }
.search-bar { max-width: 600px; margin: 1.5rem auto; padding: 0 1rem; }
.search-bar input { width: 100%; padding: 0.9rem 1.2rem; border-radius: 14px; border: 1.5px solid #334155; background: #1e293b; color: #fff; font-size: 1rem; outline: none; }
.search-bar input:focus { border-color: #6366f1; }
.actions { max-width: 600px; margin: 0 auto 1.5rem; padding: 0 1rem; }
.btn { padding: 0.7rem 1.4rem; border-radius: 10px; border: none; cursor: pointer; font-size: 0.95rem; font-weight: 600; }
.btn-primary { background: #6366f1; color: #fff; }
.btn-danger { background: #ef4444; color: #fff; font-size: 0.8rem; padding: 0.4rem 0.8rem; }
.btn-ghost { background: transparent; color: #94a3b8; border: 1.5px solid #334155; }
.cards { max-width: 600px; margin: 0 auto; padding: 0 1rem 4rem; display: flex; flex-direction: column; gap: 1rem; }
.card { background: #1e293b; border: 1.5px solid #334155; border-radius: 16px; padding: 1.2rem; cursor: pointer; }
.card:hover { border-color: #6366f1; }
.card h3 { font-size: 1.05rem; color: #fff; margin-bottom: 0.4rem; }
.card .desc { font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.6rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.tag { background: #312e81; color: #a5b4fc; font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 20px; }
.date { font-size: 0.75rem; color: #475569; margin-top: 0.5rem; }
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
.modal-bg.open { display: flex; }
.modal { background: #1e293b; border-radius: 20px; padding: 1.8rem; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; border: 1.5px solid #334155; }
.modal h2 { font-size: 1.3rem; color: #fff; margin-bottom: 1.2rem; }
.field { margin-bottom: 1rem; }
.field label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.4rem; }
.field input, .field textarea { width: 100%; padding: 0.75rem 1rem; border-radius: 10px; border: 1.5px solid #334155; background: #0f1117; color: #fff; font-size: 0.95rem; outline: none; font-family: inherit; }
.field textarea { min-height: 100px; resize: vertical; }
.modal-actions { display: flex; gap: 0.8rem; justify-content: flex-end; margin-top: 1.2rem; }
.detail-title { font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: 1rem; }
.detail-section { margin-bottom: 1rem; }
.detail-section h4 { font-size: 0.8rem; color: #6366f1; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.4rem; }
.detail-section p { color: #cbd5e1; line-height: 1.6; white-space: pre-wrap; }
.empty { text-align: center; color: #475569; padding: 3rem 0; }
.count { color: #94a3b8; font-size: 0.85rem; max-width: 600px; margin: 0 auto 0.5rem; padding: 0 1rem; }
</style>
</head>
<body>
<div class="bg"></div>
<header>
  <h1>🛠 IT Knowledge Base</h1>
  <p>מאגר תקלות ופתרונות אישי</p>
</header>
<div class="search-bar"><input type="text" id="search" placeholder="חפש תקלה, פתרון, תגית..."></div>
<div class="actions"><button class="btn btn-primary" onclick="openAdd()">+ הוסף תקלה</button></div>
<div class="count" id="count"></div>
<div class="cards" id="cards"></div>
<div class="modal-bg" id="addModal">
  <div class="modal">
    <h2>תקלה חדשה</h2>
    <div class="field"><label>כותרת *</label><input id="f-title" placeholder="לדוגמה: Outlook קופא עם ESET"></div>
    <div class="field"><label>תיאור הבעיה</label><textarea id="f-desc" placeholder="מה קרה?"></textarea></div>
    <div class="field"><label>פתרון *</label><textarea id="f-solution" placeholder="מה עשית כדי לפתור?"></textarea></div>
    <div class="field"><label>תגיות (מופרדות בפסיק)</label><input id="f-tags" placeholder="outlook, eset, windows"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeAdd()">ביטול</button>
      <button class="btn btn-primary" onclick="saveTicket()">שמור</button>
    </div>
  </div>
</div>
<div class="modal-bg" id="detailModal"><div class="modal" id="detailContent"></div></div>
</body>
</html>
